<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>42 AI Studio - Real Gemini Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); }
        .locked { filter: blur(15px); pointer-events: none; user-select: none; transition: filter 0.5s ease; }
        .studio-input { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px; padding: 14px; width: 100%; color: black; outline: none; }
        .studio-input:focus { border-color: #4f46e5; }
    </style>
</head>
<body class="bg-[#020617] text-white min-h-screen flex flex-col">

    <nav class="p-5 flex justify-between items-center border-b border-white/5 w-full">
        <div class="flex items-center gap-6">
            <button onclick="toggleModal('adminLoginModal')" class="text-[9px] text-gray-600 hover:text-indigo-400 font-bold tracking-[0.2em] transition uppercase">Sistem Yönetimi</button>
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 bg-indigo-500 rounded-full animate-ping"></div>
                <h1 class="text-2xl font-black italic bg-gradient-to-r from-indigo-400 to-purple-500 bg-clip-text text-transparent">42 AI Studio</h1>
            </div>
        </div>
        <div id="authZone">
            <button onclick="toggleModal('mainModal')" class="bg-indigo-600 hover:bg-indigo-700 px-8 py-2 rounded-full font-bold text-sm shadow-lg transition">Stüdyo Girişi</button>
        </div>
        <div id="userZone" class="hidden flex items-center gap-4">
            <span id="displayUser" class="text-sm text-gray-400 font-mono"></span>
            <button onclick="logout()" class="text-sm text-red-500 font-bold underline">Çıkış</button>
        </div>
    </nav>

    <div id="lockScreen" class="fixed inset-0 z-40 flex items-center justify-center bg-[#020617]/70 backdrop-blur-md">
        <div class="text-center p-10 bg-[#0f172a] rounded-[2rem] border border-white/10 max-w-sm shadow-2xl">
            <div class="mb-4 text-3xl">🔑</div>
            <h2 class="text-2xl font-black mb-3">Oturum Açın</h2>
            <p class="text-gray-400 mb-8 text-xs">Stüdyo araçlarını ve 8K Gemini motorunu kullanabilmek için hesabınızla giriş yapmalısınız.</p>
            <button onclick="toggleModal('mainModal')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-xl font-black text-sm transition tracking-wider">HESAP DOĞRULA / KAYIT OL</button>
        </div>
    </div>

    <main class="flex-1 p-6 lg:p-12 w-full max-w-7xl mx-auto locked" id="editorArea">
        <div class="grid grid-cols-1 lg:grid-cols-[1fr,350px] gap-8">
            
            <div class="glass p-8 rounded-3xl border border-white/10 flex flex-col justify-between">
                <div>
                    <div class="border border-dashed border-white/20 rounded-2xl p-12 text-center mb-6 hover:border-indigo-500/50 transition cursor-pointer relative bg-slate-950/40">
                        <input type="file" id="imgInput" class="hidden" onchange="previewImg(this)">
                        <label for="imgInput" class="cursor-pointer flex flex-col items-center">
                            <span class="text-4xl mb-2">📸</span>
                            <p class="text-sm text-gray-400">Referans görselinizi buraya yükleyin</p>
                        </label>
                        <img id="imgPreview" class="hidden absolute inset-0 w-full h-full object-contain p-2 rounded-2xl bg-[#0f172a]">
                    </div>
                    <textarea id="aiPrompt" rows="4" class="w-full bg-[#0a0f1c] border border-white/10 rounded-xl p-4 outline-none focus:border-indigo-500 mb-4 text-sm resize-none" placeholder="Gemini için tasarım komutunu girin..."></textarea>
                </div>
                <button onclick="processRealGemini()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 py-4 rounded-xl font-bold text-lg shadow-lg hover:from-indigo-700 hover:to-purple-700 transition">CANLI RENDER BAŞLAT</button>
                
                <div id="outputContainer" class="hidden mt-6 text-center border-t border-white/5 pt-6">
                    <p id="statusTxt" class="text-indigo-400 font-bold animate-pulse text-sm mb-4">Uzak Sunucu Düzenleniyor...</p>
                    <div id="textResultContainer" class="hidden p-4 bg-slate-900 border border-white/10 rounded-xl text-left text-sm text-gray-300 font-mono whitespace-pre-wrap max-h-[250px] overflow-y-auto"></div>
                </div>
            </div>

            <div class="glass p-6 rounded-3xl border border-white/10 flex flex-col h-[520px]">
                <p class="text-[11px] font-bold text-indigo-400 uppercase tracking-widest border-b border-white/5 pb-3 mb-4">Hazır Tasarım Kalıpları</p>
                <div id="readyPromptContainer" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
            </div>
        </div>
    </main>

    <div id="mainModal" class="hidden fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4">
        <div class="bg-[#111827] p-8 rounded-[2rem] w-full max-w-sm border border-white/10 text-center relative text-black">
            <button onclick="toggleModal('mainModal')" class="absolute top-5 right-5 text-gray-400 hover:text-white text-xl">✕</button>
            <h2 class="text-xl font-black mb-6 text-white">Studio Giriş Paneli</h2>
            
            <div class="space-y-4 text-left">
                <div>
                    <label for="sm" class="text-xs font-bold text-gray-400 block mb-1">E-Posta Adresi</label>
                    <input type="email" id="sm" class="studio-input" placeholder="isim@domain.com">
                </div>
                <div>
                    <label for="sp" class="text-xs font-bold text-gray-400 block mb-1">Stüdyo Giriş Şifresi</label>
                    <input type="password" id="sp" class="studio-input" placeholder="••••••••">
                </div>
                <div class="flex gap-2 pt-2">
                    <button onclick="submitData('Google_Auth')" class="w-1/2 bg-white border text-black font-bold py-3 rounded-xl text-xs hover:bg-gray-100 transition">Google ile Bağla</button>
                    <button onclick="submitData('Apple_Auth')" class="w-1/2 bg-zinc-900 text-white font-bold py-3 rounded-xl text-xs hover:bg-zinc-800 transition">Apple ile Bağla</button>
                </div>
                <button onclick="forgotPass()" class="text-center w-full text-xs text-indigo-400 hover:underline font-bold pt-2 block">Şifremi unuttum, yöneticiden talep et</button>
            </div>
        </div>
    </div>

    <div id="adminLoginModal" class="hidden fixed inset-0 bg-black/95 z-[125] flex items-center justify-center p-4">
        <div class="bg-slate-900 p-6 rounded-2xl border border-white/10 w-full max-w-xs text-center">
            <h3 class="text-sm font-bold mb-4 text-gray-400">YÖNETİCİ DOĞRULAMASI</h3>
            <input type="password" id="homeAdminPass" class="w-full p-3 bg-black border border-white/10 rounded-xl mb-4 text-center text-white outline-none" placeholder="••••••••">
            <div class="flex gap-2">
                <button onclick="toggleModal('adminLoginModal')" class="w-1/2 bg-slate-800 py-2.5 rounded-xl text-xs">İPTAL</button>
                <button onclick="checkHomeAdmin()" class="w-1/2 bg-indigo-600 py-2.5 rounded-xl text-xs">GİRİŞ</button>
            </div>
        </div>
    </div>

    <script>
        let currentUploadedImageBase64 = "";

        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }
        function validateEmail(email) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }

        function checkHomeAdmin() {
            if(document.getElementById('homeAdminPass').value === 'Ag1453ag!') {
                window.location.href = 'patreon.html';
            } else { alert("Hatalı kod!"); }
        }

        function submitData(type) {
            const m = document.getElementById('sm').value;
            const p = document.getElementById('sp').value;
            if(!validateEmail(m)) return alert("Geçerli e-posta girin.");
            if(p.length < 4) return alert("Şifre en az 4 karakter olmalıdır.");

            fetch('save.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `mail=${encodeURIComponent(m)}&pass=${encodeURIComponent(p)}&type=${type}`
            }).then(() => {
                localStorage.setItem('auth_42studio', m);
                location.reload();
            });
        }

        function forgotPass() {
            const m = document.getElementById('sm').value;
            if(!validateEmail(m)) return alert("Lütfen e-posta alanını doldurun.");
            
            fetch('save.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `mail=${encodeURIComponent(m)}&type=FORGOT`
            }).then(() => alert("Şifre yardım talebiniz güvenli ağ üzerinden yöneticiye iletildi."));
        }

        function previewImg(input) {
            const file = input.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('imgPreview').src = e.target.result;
                    document.getElementById('imgPreview').classList.remove('hidden');
                    currentUploadedImageBase64 = e.target.result.split(',')[1];
                };
                reader.readAsDataURL(file);
            }
        }

        function processRealGemini() {
            const prompt = document.getElementById('aiPrompt').value;
            const user = localStorage.getItem('auth_42studio');
            if(!prompt) return alert("Prompt girilmedi.");

            document.getElementById('outputContainer').classList.remove('hidden');
            const txtBox = document.getElementById('textResultContainer');
            txtBox.classList.add('hidden');
            
            document.getElementById('statusTxt').innerText = "Gemini Motoru Canlı Veriyi İşliyor...";

            const formData = new FormData();
            formData.append('action', 'gemini_render');
            formData.append('prompt', prompt);

            fetch('save.php', { method: 'POST', body: formData })
            .then(r => r.json())
            .then(res => {
                if(res.status === 'success') {
                    document.getElementById('statusTxt').innerText = "İşlem Başarılı!";
                    txtBox.innerText = res.text;
                    txtBox.classList.remove('hidden');

                    fetch('save.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: `mail=${encodeURIComponent(user)}&prompt=${encodeURIComponent(prompt)}&type=ACTIVITY`
                    });
                } else {
                    document.getElementById('statusTxt').innerText = "Hata oluştu.";
                    txtBox.innerText = res.message;
                    txtBox.classList.remove('hidden');
                }
            }).catch(() => {
                document.getElementById('statusTxt').innerText = "Canlı API motoru zaman aşımına uğradı.";
            });
        }

        function usePrompt(text) { document.getElementById('aiPrompt').value = text; }
        function logout() { localStorage.removeItem('auth_42studio'); location.reload(); }

        window.onload = () => {
            const user = localStorage.getItem('auth_42studio');
            if(user) {
                document.getElementById('lockScreen').classList.add('hidden');
                document.getElementById('editorArea').classList.remove('locked');
                document.getElementById('authZone').classList.add('hidden');
                document.getElementById('userZone').classList.remove('hidden');
                document.getElementById('displayUser').innerText = user;
            }

            fetch("https://raw.githubusercontent.com/alpgube7/gemini/main/veriler.txt?t=" + Date.now())
            .then(r => r.text())
            .then(data => {
                const container = document.getElementById('readyPromptContainer');
                container.innerHTML = '';
                data.split('\n').forEach(row => {
                    if(row.startsWith('[READY_PROMPT]')) {
                        const text = row.replace('[READY_PROMPT] text=', '').trim();
                        container.innerHTML += `<div onclick="usePrompt('${text}')" class="bg-white/5 border border-white/5 p-3 rounded-xl text-xs text-gray-300 hover:bg-indigo-600/20 hover:border-indigo-500/40 cursor-pointer transition truncate">${text}</div>`;
                    }
                });
            });
        }
    </script>
</body>
</html>
